<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1026"><title>Web Book | Glowhum</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0b1026;--panel:#171e36;--ink:#f5f1e8;--muted:#bac3d9;--accent:#ffb454}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}a{color:var(--accent)}h1{font-size:clamp(2rem,6vw,4rem);line-height:1.1}h2{margin:0}nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0}button{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid #59627b;border-radius:10px;padding:10px 14px}button:hover,button:focus-visible{border-color:var(--accent)}button[aria-current=true]{border-color:var(--accent);color:var(--accent)}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.8fr);gap:24px}.card{background:var(--panel);border:1px solid #39425b;border-radius:18px;padding:22px;margin:16px 0}.source{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.controls label{display:flex;gap:8px;align-items:center}.quiz button{display:block;width:100%;margin:7px 0;text-align:left}.feedback{min-height:2em;color:var(--accent)}.chapter-progress{width:100%;height:12px;accent-color:var(--accent)}@media(max-width:700px){.grid{display:block}main{padding:16px}}
</style><main><a href="/">GLOWHUM</a><p>Interactive Web Book</p><h1 id="title">Loading book…</h1><p id="scope"></p><nav id="chapters" aria-label="Chapters"></nav><div class="grid"><section><article class="card"><h2 id="chapterTitle"></h2><p id="caption" aria-live="polite"></p><label for="progress">Reading progress</label><progress class="chapter-progress" id="progress" value="1" max="1"></progress><p class="source" id="passage"></p><a id="sourceLink" target="_blank" rel="noopener">Open source PDF passage ↗</a><p><a id="originalSourceLink" target="_blank" rel="noopener" hidden>Open original source citation ↗</a></p></article><section class="card quiz"><h2>Check understanding</h2><p id="question"></p><div id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></section><aside class="card"><h2>Listen</h2><p>Read along with captions above.</p><div class="controls"><button id="play" type="button">Play narration</button><button id="stop" type="button">Stop</button><label>Volume <input id="volume" type="range" min="0" max="1" step=".05" value=".8"></label><label>Speed <select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label></div><p id="voiceNote">Narration uses your device's voice.</p><p><a href="source.pdf" target="_blank" rel="noopener">Read full source PDF</a></p></aside></div></main><script src="/book-client.js" defer></script></html>
