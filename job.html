<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Job view | GLOWHUM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--night:#0b1026;--panel:#121a3d;--line:#2b376b;--ink:#eef0ff;--dim:#adb5d8;--core:#ffb454;--aura:#ff7a3d;--bad:#ff9a9a;--ok:#6ee7b7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#28386e 0,var(--night) 42rem);color:var(--ink);font:17px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(100% - 40px,760px);margin:auto}header{padding:25px 0}.brand{color:var(--ink);font-weight:900;letter-spacing:.13em;text-decoration:none}.brand b,.eyebrow{color:var(--core)}main{padding:6vh 0 70px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(38px,7vw,64px);line-height:1.04;letter-spacing:-.045em;margin:10px 0}.muted,.label{color:var(--dim)}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 60px #02061666}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.fact{background:#0e1533;padding:16px}.fact strong{display:block;font-size:21px;margin-top:4px}.prompt{white-space:pre-wrap;word-break:break-word;background:#080d24;border-radius:12px;padding:16px;margin:8px 0 0}.status{color:var(--ok)}.error{color:var(--bad)}.back{display:inline-block;color:var(--dim);font-weight:800;text-decoration:none;margin-top:25px}.back:hover{color:var(--core)}[hidden]{display:none}@media(max-width:560px){.facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="wrap"><a class="brand" href="/">GLOW<b>HUM</b></a></header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Customer job</div>
      <h1 id="title">Loading your job.</h1>
      <p class="muted" id="summary">The job record is loading.</p>
    </section>
    <section class="card" id="jobCard" hidden>
      <div class="facts">
        <div class="fact"><span class="label">State</span><strong class="status" id="jobStatus"></strong></div>
        <div class="fact"><span class="label">Quoted price</span><strong id="jobPrice"></strong></div>
        <div class="fact"><span class="label">Engine</span><strong id="jobEngine"></strong></div>
        <div class="fact"><span class="label">Job ID</span><strong id="jobId"></strong></div>
      </div>
      <p class="label">Input</p>
      <div class="prompt" id="jobInput"></div>
      <p class="label">Output</p>
      <div class="prompt" id="jobOutput">No output yet.</div>
    </section>
    <a class="back" href="/">Back to Glowhum</a>
  </main>
  <script>
    (function(){
      var id=new URLSearchParams(location.search).get('id');
      var title=document.getElementById('title'),summary=document.getElementById('summary'),card=document.getElementById('jobCard');
      function showError(message){title.textContent='Job not found';summary.textContent=message;summary.className='error';}
      if(!id){showError('Open this page from a customer job link.');return;}
      fetch('/api/jobs/'+encodeURIComponent(id),{cache:'no-store'}).then(function(response){return response.json().then(function(body){return {ok:response.ok,body:body};});}).then(function(result){
        if(!result.ok)throw new Error(result.body.error||'This job is not available.');
        var job=result.body;title.textContent=job.engine;summary.textContent=job.canary?'Quoted canary price. No payment is taken by this job record.':'Customer job';card.hidden=false;
        document.getElementById('jobStatus').textContent=job.status;document.getElementById('jobPrice').textContent=job.price.amount+' '+job.price.currency;document.getElementById('jobEngine').textContent=job.capability;document.getElementById('jobId').textContent=job.id;
        document.getElementById('jobInput').textContent=job.input.prompt||'';document.getElementById('jobOutput').textContent=job.output?JSON.stringify(job.output,null,2):'No output yet.';
      }).catch(function(error){showError(error.message||'This job is not available.');});
    })();
  </script>
</body>
</html>
