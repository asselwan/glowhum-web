<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1026">
  <title>Order status | GLOWHUM</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--night:#0b1026;--panel:#121a3d;--line:#2b376b;--ink:#eef0ff;--dim:#adb5d8;--core:#ffb454;--aura:#ff7a3d;--ok:#6ee7b7;--bad:#ff9a9a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:start center;background:radial-gradient(circle at 50% -10%,#2b3d78 0,var(--night) 45rem);color:var(--ink);font:17px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:6vh 20px 60px}
    .card{width:min(100%,650px);padding:34px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #02061666}
    .brand{color:var(--ink);font-weight:900;letter-spacing:.13em;text-decoration:none}
    .brand b,.eyebrow{color:var(--core)}
    .eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-top:35px}
    .state{font-size:clamp(28px,7vw,46px);line-height:1.1;letter-spacing:-.03em;margin:8px 0 10px}
    .message{color:var(--dim);margin:0}
    .error{color:var(--bad)}

    .tracker{list-style:none;display:flex;gap:8px;padding:0;margin:26px 0 4px}
    .tracker li{flex:1;min-width:0}
    .tracker .dot-row{display:flex;align-items:center;gap:0}
    .tracker .dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--line);flex:0 0 auto;transition:background .4s ease,box-shadow .4s ease}
    .tracker .bar{flex:1;height:2px;background:var(--line);transition:background .4s ease}
    .tracker li:first-child .dot-row .bar:first-child{display:none}
    .tracker li .label{margin-top:10px;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.02em}
    .tracker li.done .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
    .tracker li.done .label{color:var(--ink)}
    .tracker li.done .bar{background:var(--ok)}
    .tracker li.current .dot{background:var(--core);box-shadow:0 0 0 2px var(--core);animation:pulse 1.6s ease-in-out infinite}
    .tracker li.current .label{color:var(--core)}
    .tracker li.closed .dot{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
    .tracker li.closed .label{color:var(--bad)}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--core)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--core) 30%,transparent)}}
    @media (prefers-reduced-motion: reduce){.tracker li.current .dot{animation:none}}

    .details{border-top:1px solid var(--line);margin-top:25px;padding-top:20px}
    .details p{margin:8px 0;color:var(--dim)}
    .details b{color:var(--ink)}
    .idrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .idrow span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);word-break:break-all}
    .copy{border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-size:13px;font-weight:800;border-radius:8px;padding:5px 10px;cursor:pointer}
    .copy:hover{color:var(--core);border-color:var(--core)}
    .copy[data-copied="true"]{color:var(--ok);border-color:var(--ok)}
    .link{display:inline-block;color:var(--core);font-weight:800;margin-top:8px;word-break:break-all}
    .back{color:var(--dim);display:inline-block;margin-top:28px;font-weight:800;text-decoration:none}
    .back:hover{color:var(--core)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    [hidden]{display:none}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">GLOW<b>HUM</b></a>
    <div class="eyebrow">Order status</div>
    <h1 class="state" id="state">Checking your order</h1>
    <p class="message" id="message">We are watching your order. This page updates on its own.</p>

    <ol class="tracker" id="tracker" hidden aria-label="Order progress">
      <li id="stepPaid"><div class="dot-row"><span class="bar"></span><span class="dot"></span><span class="bar"></span></div><div class="label">Paid</div></li>
      <li id="stepRendering"><div class="dot-row"><span class="bar"></span><span class="dot"></span><span class="bar"></span></div><div class="label">Rendering</div></li>
      <li id="stepPublished"><div class="dot-row"><span class="bar"></span><span class="dot"></span><span class="bar"></span></div><div class="label">Published</div></li>
    </ol>

    <div class="details" id="details" hidden>
      <p class="idrow"><b>Order</b> <span id="orderId"></span> <button class="copy" id="copyId" type="button">Copy</button></p>
      <p id="publishedRow" hidden><b>Published</b> <time id="publishedAt"></time></p>
      <a class="link" id="videoLink" href="#" hidden rel="noopener noreferrer" target="_blank">Watch your episode</a>
    </div>
    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    <a class="back" href="/">Start another order</a>
  </main>
  <script>
    (function(){
      var id=new URLSearchParams(window.location.search).get('order_id');
      var state=document.getElementById('state'),message=document.getElementById('message'),details=document.getElementById('details');
      var tracker=document.getElementById('tracker'),live=document.getElementById('live');
      var steps={paid:document.getElementById('stepPaid'),rendering:document.getElementById('stepRendering'),published:document.getElementById('stepPublished')};
      var order={paid:0,rendering:1,published:2};
      var titles={paid:'Payment received',rendering:'Your episode is rendering',published:'Your episode is published',refunded:'Payment refunded'};
      var messages={paid:'Your order is in line. We will begin making the episode soon.',rendering:'Your episode is being made now.',published:'Your finished episode is ready.',refunded:'This order was refunded. Access for this order has ended.'};
      function showError(text){tracker.hidden=true;state.textContent='We could not find that order';message.textContent=text;message.className='message error';}
      function safeVideoUrl(value){try{var url=new URL(value);return url.protocol==='https:'?url.href:null;}catch(error){return null;}}
      function paintTracker(status){
        if(status==='refunded'){tracker.hidden=true;return;}
        tracker.hidden=false;
        var at=order[status]===undefined?0:order[status];
        Object.keys(steps).forEach(function(key){
          var el=steps[key],pos=order[key];
          el.className=pos<at?'done':pos===at?'current':'';
        });
      }
      function load(){
        if(!id||!/^cs_[A-Za-z0-9_]+$/.test(id)){showError('Open this page from your payment confirmation.');return;}
        fetch('/api/order/'+encodeURIComponent(id)).then(function(response){return response.json().then(function(body){return {ok:response.ok,body:body};});}).then(function(result){
          if(!result.ok){showError('Payment may still be confirming. This page will check again shortly.');setTimeout(load,4000);return;}
          var order=result.body,status=titles[order.status]?order.status:'paid';
          state.textContent=titles[status];message.textContent=messages[status];message.className='message';details.hidden=false;document.getElementById('orderId').textContent=order.order_id;
          paintTracker(status);
          live.textContent=titles[status];
          if(order.published_at){var published=document.getElementById('publishedRow');published.hidden=false;document.getElementById('publishedAt').textContent=new Date(order.published_at).toLocaleString();}
          var video=safeVideoUrl(order.video_url);if(video){var link=document.getElementById('videoLink');link.href=video;link.hidden=false;}
          if(status!=='published'&&status!=='refunded')setTimeout(load,8000);
        }).catch(function(){showError('We could not check the order right now. This page will try again shortly.');setTimeout(load,4000);});
      }
      document.getElementById('copyId').addEventListener('click',function(){
        var text=document.getElementById('orderId').textContent;
        var button=this;
        var done=function(){button.dataset.copied='true';button.textContent='Copied';setTimeout(function(){button.dataset.copied='false';button.textContent='Copy';},1800);};
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){});}
      });
      load();
    })();
  </script>
</body>
</html>
</content>
